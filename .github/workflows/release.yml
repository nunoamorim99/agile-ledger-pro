name: release

# Publishes the downloadable install bundles.
#
# Tag a version to cut a release:
#   git tag v1.0.1 && git push origin v1.0.1
#
# The tag must match the version in plugins/agile-ledger-pro/.claude-plugin/plugin.json,
# so the Releases page can never advertise a version the plugin doesn't declare.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches the plugin version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          MANIFEST=$(python3 -c "import json;print(json.load(open('plugins/agile-ledger-pro/.claude-plugin/plugin.json'))['version'])")
          echo "tag=$TAG  plugin.json=$MANIFEST"
          if [ "$TAG" != "$MANIFEST" ]; then
            echo "::error::Tag v$TAG does not match plugin.json version $MANIFEST. Bump the manifests or retag."
            exit 1
          fi

      - name: Build bundles
        run: python3 scripts/build_bundles.py --check

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
          body: |
            ## Install

            **Claude Code — marketplace (recommended)**
            ```
            /plugin marketplace add nunoamorim99/agile-ledger-pro
            /plugin install agile-ledger-pro@nunoamorim99-pro
            ```

            **Claude Code — manual, no marketplace**
            Download `agile-ledger-pro-<version>.zip` below and unzip it into your project's
            `.claude/` folder (or `~/.claude/` for every project). Restart Claude Code.

            **Claude.ai web or desktop**
            Download `agile-ledger-pro-skill-<version>.zip` below and upload it under
            *Customize → Skills*. (Slash commands are Claude Code only; on the web the
            skill is driven by natural language.)
