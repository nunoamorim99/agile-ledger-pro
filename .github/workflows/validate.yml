name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Plugin manifest is valid and the plugin is complete
        run: |
          python3 - <<'PY'
          import json, os, sys

          src = 'plugins/agile-ledger-pro'
          pj = json.load(open(os.path.join(src, '.claude-plugin', 'plugin.json')))
          errors = []

          if pj.get('name') != 'agile-ledger-pro':
              errors.append(f"plugin.json name is {pj.get('name')!r}, expected 'agile-ledger-pro'")
          if not pj.get('version'):
              errors.append("plugin.json has no version")
          for required in ('commands', 'skills/agile-ledger-pro/SKILL.md', 'dashboard/serve.py'):
              if not os.path.exists(os.path.join(src, required)):
                  errors.append(f"missing {src}/{required}")

          if errors:
              print("FAILED:", file=sys.stderr)
              for e in errors:
                  print(f"  - {e}", file=sys.stderr)
              sys.exit(1)
          print(f"OK  {pj['name']} {pj['version']}  (listed in the nunoamorim99 marketplace: nunoamorim99/claude-skills)")
          PY

      - name: Dashboard reads and writes a ledger correctly
        run: python3 plugins/agile-ledger-pro/dashboard/tests/run_tests.py

      - name: Dashboard sources compile
        run: |
          python3 -m compileall -q plugins/agile-ledger-pro/dashboard
          node --check plugins/agile-ledger-pro/dashboard/static/app.js

      - name: Install bundles build and contain the right files
        run: python3 scripts/build_bundles.py --check
