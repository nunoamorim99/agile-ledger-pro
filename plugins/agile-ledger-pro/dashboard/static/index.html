<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agile Ledger Pro</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/tokens.css">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header class="topbar">
  <button class="brand" type="button" id="brand" aria-label="Agile Ledger Pro — Overview">
    <svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true">
      <rect width="32" height="32" rx="8" style="fill: var(--accent)"/>
      <path d="M5.5 24 12.5 8V24M8.35 17.5H12.5M17.5 8V24H26.5" fill="none"
            style="stroke: var(--on-accent)" stroke-width="3"
            stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span class="brand-name">Agile Ledger</span><span class="brand-pro">Pro</span>
  </button>

  <label class="field inline">
    <span class="field-label">Project</span>
    <select id="repo-picker" aria-label="Project"></select>
  </label>

  <label class="field inline">
    <span class="field-label">Person</span>
    <select id="person-picker" aria-label="Filter by assignee"></select>
  </label>

  <div class="spacer"></div>

  <span id="ledger-path" class="ledger-path" title=""></span>
  <button id="commit-btn" class="btn" type="button">Commit ledger</button>
  <button id="theme-btn" class="btn icon" type="button" aria-label="Switch theme" title="Switch theme">◐</button>
</header>

<nav class="tabs" id="tabs" role="tablist"></nav>

<main id="view" class="view" role="main" aria-live="polite"></main>

<div id="drawer" class="drawer" hidden aria-hidden="true">
  <div class="drawer-scrim" data-close="1"></div>
  <aside class="drawer-panel" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
    <header class="drawer-head">
      <h2 id="drawer-title"></h2>
      <button class="btn icon" type="button" data-close="1" aria-label="Close">✕</button>
    </header>
    <div id="drawer-body" class="drawer-body"></div>
  </aside>
</div>

<div id="modal" class="modal" hidden aria-hidden="true">
  <div class="modal-scrim" data-close="1"></div>
  <form class="modal-panel" id="modal-form" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <header class="modal-head">
      <h2 id="modal-title"></h2>
      <button class="btn icon" type="button" data-close="1" aria-label="Close">✕</button>
    </header>
    <div id="modal-body" class="modal-body"></div>
    <footer class="modal-foot">
      <p id="modal-note" class="modal-note"></p>
      <div class="modal-actions">
        <button class="btn" type="button" data-close="1">Cancel</button>
        <button class="btn primary" type="submit" id="modal-submit">Save</button>
      </div>
    </footer>
  </form>
</div>

<div id="toasts" class="toasts" aria-live="assertive"></div>

<script src="/static/app.js"></script>
</body>
</html>
