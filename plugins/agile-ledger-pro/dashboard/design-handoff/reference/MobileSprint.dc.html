<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone — Sprint</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.app{--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;--mono:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace;--serif:ui-serif,"New York","Iowan Old Style",Georgia,serif;font-family:var(--sans);color:var(--ink);background:var(--bg);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
.t-light{--bg:#F3F4F6;--surface:#FFFFFF;--sunken:#EAECF0;--ink:#14161B;--ink2:#454B56;--ink3:#5F6673;--rule:#E1E4E9;--rule2:#CBD0D8;--accent:#0B7A75;--accent-soft:#E4F4F2;--on-accent:#FFFFFF;--good:#1D7148;--good-soft:#E2F1E9;--warn:#8F5400;--warn-soft:#FAEFD9;--serious:#B93E0A;--serious-soft:#FBE8DD;--crit:#AF2218;--crit-soft:#FAE5E3}
.t-dark{--bg:#0E1014;--surface:#161920;--sunken:#0A0C0F;--ink:#E7E9ED;--ink2:#B3B9C3;--ink3:#8E95A1;--rule:#252931;--rule2:#343A45;--accent:#3FD4C6;--accent-soft:#0F2B2A;--on-accent:#0E1014;--good:#5BC593;--good-soft:#11281D;--warn:#E6AE4A;--warn-soft:#2A2211;--serious:#EF8A5C;--serious-soft:#2D1A11;--crit:#F07569;--crit-soft:#2E1514}
a{color:var(--accent)}
button{font:inherit;color:inherit}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.chip{flex:none;display:inline-flex;align-items:center;gap:7px;height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--rule2);background:transparent;color:var(--ink2);font-size:13px;font-weight:600;cursor:pointer}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip .c{font-family:var(--mono);font-size:11.5px;font-weight:500;opacity:.8}
.kc{display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:14px;background:var(--surface);border:1px solid var(--rule)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:52px;font-size:11px;font-weight:550;color:var(--ink3);text-decoration:none}
.tab[aria-current=page]{color:var(--accent)}
.mv{height:44px;padding:0 14px;border-radius:11px;border:1px solid var(--rule2);background:transparent;font-size:13px;font-weight:600;cursor:pointer}
</style>
</helmet>
<div class="app t-{{theme}}" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden">
  <header style="display: flex; flex-direction: column; gap: 4px; padding: 52px 16px 12px">
    <span style="font-size: 12px; color: var(--ink3)"><span class="mono">2026-S07</span> · day 6 of 10 · <span style="color: var(--warn); font-weight: 600">≈ 10 pt behind</span></span>
    <h1 style="margin: 0; font-family: var(--serif); font-size: 26px; font-weight: 600; letter-spacing: -0.01em">Dashboard foundations</h1>
  </header>

  <div role="group" aria-label="Board column" style="display: flex; gap: 8px; padding: 0 16px 12px; overflow-x: auto">
    <sc-for list="{{cols}}" as="c" hint-placeholder-count="5">
      <button class="chip" type="button" aria-pressed="{{c.on}}" onClick="{{c.pick}}">{{c.name}}<span class="c">{{c.count}}</span></button>
    </sc-for>
  </div>

  <div style="flex: 1; overflow: hidden; padding: 0 16px 16px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; justify-content: space-between; align-items: center; font-size: 12.5px; color: var(--ink2)">
      <span>{{summary}}</span>
      <button type="button" style="height: 36px; padding: 0 10px; border-radius: 9px; border: 1px solid var(--rule2); background: transparent; font-size: 12.5px; cursor: pointer">Lane: everyone</button>
    </div>
    <sc-for list="{{cards}}" as="k" hint-placeholder-count="2">
      <article class="kc">
        <div style="display: flex; align-items: center; gap: 8px">
          <span style="color: var(--accent); display: flex"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="5.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="{{fill}}" fill="currentColor"/></svg></span>
          <span class="mono" style="font-size: 12px; color: var(--ink2)">{{k.id}}</span>
          <span class="mono" style="margin-left: auto; font-size: 12px; color: var(--ink2)">{{k.pts}} pt</span>
        </div>
        <a href="#" style="color: var(--ink); text-decoration: none; font-size: 15px; font-weight: 600; line-height: 1.3">{{k.title}}</a>
        <sc-if value="{{k.hasBlock}}" hint-placeholder-val="{{false}}"><span style="display: flex; gap: 8px; padding: 8px 10px; border-radius: 9px; background: var(--crit-soft); color: var(--crit); font-size: 12.5px"><strong>Blocked</strong> {{k.block}}</span></sc-if>
        <sc-if value="{{k.hasWarn}}" hint-placeholder-val="{{false}}"><span style="display: flex; gap: 8px; padding: 8px 10px; border-radius: 9px; background: var(--warn-soft); color: var(--warn); font-size: 12.5px">{{k.warn}}</span></sc-if>
        <div style="display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ink2)">
          <span style="width: 22px; height: 22px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 10px; font-weight: 650; background: var(--accent-soft); color: var(--accent)">{{k.initial}}</span>{{k.who}}
          <span style="flex: 1"></span>
          <button class="mv" type="button">{{k.action}}</button>
        </div>
      </article>
    </sc-for>
    <p style="margin: 4px 0 0; font-size: 12px; color: var(--ink3); text-align: center">Swipe the column bar or tap a chip · Move sends one ledger edit</p>
  </div>

  <nav aria-label="Main" style="display: flex; padding: 4px 6px 26px; border-top: 1px solid var(--rule); background: var(--surface)">
    <a class="tab" href="MobileToday.dc.html"><svg width="20" height="20" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="8" cy="8" r="5.5"/><path d="M8 5v3l2 1.5" stroke-linecap="round"/></svg>Today</a>
    <a class="tab" href="#"><svg width="20" height="20" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M2.5 9.5 4 3.5h8l1.5 6v3h-11zM2.5 9.5h3.5l.8 1.5h2.4l.8-1.5h3.5" stroke-linejoin="round"/></svg>Inbox</a>
    <a class="tab" href="#"><svg width="20" height="20" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M3 4h10M3 8h10M3 12h6" stroke-linecap="round"/></svg>Backlog</a>
    <a class="tab" href="MobileSprint.dc.html" aria-current="page"><svg width="20" height="20" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="2.5" y="3" width="3" height="10" rx="1"/><rect x="6.5" y="3" width="3" height="7" rx="1"/><rect x="10.5" y="3" width="3" height="4" rx="1"/></svg>Sprint</a>
    <a class="tab" href="#"><svg width="20" height="20" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="3.5" cy="8" r="1.2" fill="currentColor"/><circle cx="8" cy="8" r="1.2" fill="currentColor"/><circle cx="12.5" cy="8" r="1.2" fill="currentColor"/></svg>More</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const sel = (this.state && this.state.col) || 'prog';
    const cols = [
      { key: 'todo', name: 'To Do', next: '→ In Progress', fill: 'M7 5.5a1.5 1.5 0 1 1 0 3a1.5 1.5 0 1 1 0-3Z' },
      { key: 'prog', name: 'In Progress', next: '→ In Review', fill: 'M7 7V3.25A3.75 3.75 0 0 1 10.75 7Z' },
      { key: 'rev', name: 'In Review', next: '→ In PR', fill: 'M7 7V3.25A3.75 3.75 0 0 1 7 10.75Z' },
      { key: 'pr', name: 'In PR', next: '→ Done', fill: 'M7 7V3.25A3.75 3.75 0 1 1 3.25 7Z' },
      { key: 'done', name: 'Done', next: 'Open', fill: 'M7 3.25a3.75 3.75 0 1 1 0 7.5a3.75 3.75 0 1 1 0-7.5Z' }
    ];
    const items = [
      { id: 'US-033', title: 'Today view: Needs-you queue', col: 'todo', pts: 3, who: 'Nuno' },
      { id: 'US-035', title: 'Standing Health view', col: 'todo', pts: 3, who: 'Rui', block: 'waiting on US-038 · 2 days' },
      { id: 'US-032', title: 'Command palette with ID search', col: 'prog', pts: 5, who: 'Nuno', warn: 'Needs US-031, still In Review' },
      { id: 'US-034', title: 'Board swimlanes by assignee', col: 'prog', pts: 3, who: 'Rui' },
      { id: 'US-031', title: 'Item URLs and back-button routing', col: 'rev', pts: 5, who: 'Ana' },
      { id: 'BUG-011', title: 'Drawer loses scroll on live reload', col: 'pr', pts: 2, who: 'Rui' },
      { id: 'US-029', title: 'Job-shaped navigation rail', col: 'done', pts: 3, who: 'Ana' }
    ];
    const cur = cols.find((c) => c.key === sel);
    const inCol = items.filter((i) => i.col === sel);
    return {
      theme: this.props.theme ?? 'dark',
      fill: cur.fill,
      summary: inCol.length + ' items · ' + inCol.reduce((a, b) => a + b.pts, 0) + ' pt',
      cols: cols.map((c) => ({
        name: c.name,
        count: items.filter((i) => i.col === c.key).length,
        on: c.key === sel ? 'true' : 'false',
        pick: () => this.setState({ col: c.key })
      })),
      cards: inCol.map((i) => ({
        ...i,
        initial: i.who.charAt(0),
        hasBlock: !!i.block,
        hasWarn: !!i.warn,
        action: i.block ? 'Unblock…' : cur.next
      }))
    };
  }
}
</script>
</body>
</html>
